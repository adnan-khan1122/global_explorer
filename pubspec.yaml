name: global_explorer
description: Global Explorer — geographic discovery, favorites, and regional media.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^15.1.2
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  provider: ^6.1.5
  stream_transform: ^2.1.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  get_it: ^7.6.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true
  assets:
    - assets/dotenv.defaults
